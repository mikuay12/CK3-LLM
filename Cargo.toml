[package]
name = "ck3-llm"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Desktop client for the CK3-LLM local multiplayer project"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
libloading = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
rfd = { version = "0.15", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"

[dev-dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
