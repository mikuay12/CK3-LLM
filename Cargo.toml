[package]
name = "ck3-llm"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Desktop client for the CK3-LLM local multiplayer project"

[features]
host-bridge = ["dep:frida"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.22"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
frida = { version = "=0.17.2", optional = true }
hmac = "0.12"
libloading = "0.8"
prost = "0.14"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
rfd = { version = "0.15", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
tokio = { version = "1.48", features = ["macros", "net", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "v5"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
