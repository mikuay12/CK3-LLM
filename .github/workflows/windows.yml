name: Windows build

on:
  push:
    branches: [main, rust-rewrite]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    env:
      RUSTUP_TOOLCHAIN: 1.100.0-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install 1.100.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run offline tests
        run: cargo test --locked
      - name: Build Windows app
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Create ZIP
        run: ./scripts/package.ps1 -Target x86_64-pc-windows-msvc
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ck3-llm-windows-x64
          path: dist/ck3-llm-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ck3-llm-windows-x64
          path: dist
      - name: Publish ZIP to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($assets -contains 'ck3-llm-windows-x64.zip') { exit 0 }
            gh release upload $env:GITHUB_REF_NAME dist/ck3-llm-windows-x64.zip --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:GITHUB_REF_NAME dist/ck3-llm-windows-x64.zip --verify-tag --generate-notes --repo $env:GITHUB_REPOSITORY
          }
          exit $LASTEXITCODE
